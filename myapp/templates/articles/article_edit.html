{% extends 'base.html' %}

{% block content %}
<div class="main-content">
    <h2>ویرایش مقاله</h2>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_title">عنوان مقاله:</label>
            {{ form.title }}
        </div>
        
        <div class="form-group">
            <label for="id_content">محتوای مقاله:</label>
            {{ form.content }}
        </div>

        <button type="submit" class="btn-submit">ویرایش مقاله</button>
    </form>
    
    <a href="{% url 'article_detail' article.pk %}" class="btn-back">بازگشت به مقاله</a>
</div>
{% endblock %}
